name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Eén deploy tegelijk. Een lopende deploy wordt nooit halverwege afgebroken;
# een nieuwere push wacht en vervangt alleen een nog niet gestarte run.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy_test:
    name: Deploy to test
    runs-on: ubuntu-latest

    environment:
      name: test
      url: https://test.jpwebcreation.nl/

    permissions:
      contents: read

    env:
      DEPLOY_HOST: test.jpwebcreation.nl
      DEPLOY_USER: jpwebcreation
      DEPLOY_PATH: /home/jpwebcreation/test.jpwebcreation.nl

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate SEO metadata
        run: python3 .github/scripts/check-seo.py

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.JPWEB_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing required secret: JPWEB_DEPLOY_SSH_KEY" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/jpweb_deploy_key
          chmod 600 ~/.ssh/jpweb_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Write GSC OAuth config
        env:
          GSC_CLIENT_ID: ${{ secrets.JPWEB_GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.JPWEB_GSC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$GSC_CLIENT_ID" ] || [ -z "$GSC_CLIENT_SECRET" ]; then
            echo "GSC secrets ontbreken; gsc-oauth.php niet geschreven." >&2
            exit 0
          fi
          umask 077
          php -r '$c=["gsc_client_id"=>getenv("GSC_CLIENT_ID"),"gsc_client_secret"=>getenv("GSC_CLIENT_SECRET"),"gsc_redirect_uri"=>"https://jpwebcreation.nl/app/gsc/callback.php"]; echo "<?php\nreturn ", var_export($c, true), ";\n";' > /tmp/gsc-oauth.php
          ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p "$HOME/private" && chmod 700 "$HOME/private" && umask 077 && cat > "$HOME/private/gsc-oauth.php.tmp" && chmod 600 "$HOME/private/gsc-oauth.php.tmp" && mv "$HOME/private/gsc-oauth.php.tmp" "$HOME/private/gsc-oauth.php" && { [ ! -f "$HOME/private/ai-scan-config.php" ] || chmod 600 "$HOME/private/ai-scan-config.php"; }' \
            < /tmp/gsc-oauth.php
          rm -f /tmp/gsc-oauth.php

      - name: Deploy static files
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='*.md' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='config-examples/' \
            --exclude='ops/' \
            -e "ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Verify test deployment
        env:
          BASE_URL: https://test.jpwebcreation.nl
        run: |
          set -euo pipefail

          routes=(
            "/"
            "/ai/"
            "/ai-vindbaarheid/"
            "/blog/"
            "/blog/hoeveel-tijd-kost-een-vooropname-installatiebedrijf.html"
            "/digitale-opname/"
            "/digitale-opname/vergelijken/"
            "/privacyverklaring/"
            "/algemene-voorwaarden/"
            "/projecten/mikes-pianoshow/"
            "/projecten/haveka-installatie/"
            "/projecten/supper-services/"
            "/projecten/ec-eens/"
            "/projecten/archipel-bouwadvies/"
            "/projecten/wildfloweroffice/"
            "/projecten/synk-by-jeanette/"
            "/sitemap.xml"
            "/robots.txt"
          )

          for route in "${routes[@]}"; do
            echo "Controleer $route"
            if ! curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "$BASE_URL$route" > /dev/null; then
              echo "Kritieke route mislukt: $route" >&2
              exit 1
            fi
          done

          bash .github/scripts/check-redirects.sh "$BASE_URL"

          headers="$(curl --silent --show-error --head \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$BASE_URL/")"
          if ! grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo "Testomgeving mist de verplichte noindex-header." >&2
            exit 1
          fi

          missing_url="$BASE_URL/__jpweb_deployment_smoke_test__"
          missing_status="$(curl --silent --show-error --output /tmp/jpweb-404.html \
            --write-out '%{http_code}' "$missing_url")"
          if [ "$missing_status" != "404" ]; then
            echo "Onbekende route gaf HTTP $missing_status in plaats van 404." >&2
            exit 1
          fi
          grep -q 'Hier staat niets meer.' /tmp/jpweb-404.html

          contact_state="$(curl --fail --silent --show-error \
            "$BASE_URL/contact.php?action=state")"
          grep -q '"values":\[\]' <<< "$contact_state"

          ai_scan_state="$(curl --fail --silent --show-error \
            "$BASE_URL/ai-scan.php?action=state")"
          grep -q '"values":\[\]' <<< "$ai_scan_state"

  # Productie volgt automatisch, maar alleen als test en de rooktest daar slagen.
  deploy_production:
    name: Deploy to production
    needs: deploy_test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DEPLOY_HOST: test.jpwebcreation.nl
      DEPLOY_USER: jpwebcreation
      DEPLOY_PATH: /home/jpwebcreation/public_html

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate SEO metadata
        run: python3 .github/scripts/check-seo.py

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.JPWEB_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing required secret: JPWEB_DEPLOY_SSH_KEY" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/jpweb_deploy_key
          chmod 600 ~/.ssh/jpweb_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Write GSC OAuth config
        env:
          GSC_CLIENT_ID: ${{ secrets.JPWEB_GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.JPWEB_GSC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$GSC_CLIENT_ID" ] || [ -z "$GSC_CLIENT_SECRET" ]; then
            echo "GSC secrets ontbreken; gsc-oauth.php niet geschreven." >&2
            exit 0
          fi
          umask 077
          php -r '$c=["gsc_client_id"=>getenv("GSC_CLIENT_ID"),"gsc_client_secret"=>getenv("GSC_CLIENT_SECRET"),"gsc_redirect_uri"=>"https://jpwebcreation.nl/app/gsc/callback.php"]; echo "<?php\nreturn ", var_export($c, true), ";\n";' > /tmp/gsc-oauth.php
          ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p "$HOME/private" && chmod 700 "$HOME/private" && umask 077 && cat > "$HOME/private/gsc-oauth.php.tmp" && chmod 600 "$HOME/private/gsc-oauth.php.tmp" && mv "$HOME/private/gsc-oauth.php.tmp" "$HOME/private/gsc-oauth.php" && { [ ! -f "$HOME/private/ai-scan-config.php" ] || chmod 600 "$HOME/private/ai-scan-config.php"; }' \
            < /tmp/gsc-oauth.php
          rm -f /tmp/gsc-oauth.php

      - name: Deploy static files
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='*.md' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='config-examples/' \
            --exclude='ops/' \
            -e "ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Write runner dispatch config
        env:
          DISPATCH_TOKEN: ${{ secrets.JPWEB_FREESCAN_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "JPWEB_FREESCAN_DISPATCH_TOKEN ontbreekt; scan start via het 30-minutenschema."
            exit 0
          fi
          umask 077
          php -r '$c=["runner_dispatch_token"=>getenv("DISPATCH_TOKEN")]; echo "<?php\nreturn ", var_export($c, true), ";\n";' > /tmp/freescan-dispatch.php
          ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p "$HOME/private" && chmod 700 "$HOME/private" && umask 077 && cat > "$HOME/private/freescan-dispatch.php.tmp" && chmod 600 "$HOME/private/freescan-dispatch.php.tmp" && mv "$HOME/private/freescan-dispatch.php.tmp" "$HOME/private/freescan-dispatch.php"' \
            < /tmp/freescan-dispatch.php
          rm -f /tmp/freescan-dispatch.php

      - name: One-time Appfront in concurrentenlijst JPWC + check testaccounts (GEO wk42)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "OPS_ROOT='$DEPLOY_PATH' OPS_JOB='appfront-jpwc-20261014' OPS_MODE='set_profile' OPS_EMAIL='jorispaarde@gmail.com' OPS_WEBSITE='jpwebcreation.nl' OPS_PROFILE_B64='eyJjb21wZXRpdG9ycyI6IHsibGlzdCI6IFt7Im5hbWUiOiAiQXBwZnJvbnQiLCAiYWxpYXNlcyI6IFsiQXBwZnJvbnQiXSwgImRvbWFpbnMiOiBbImFwcGZyb250Lm5sIl19XX19' /usr/local/bin/php -d display_errors=stderr -d error_reporting=E_ALL" \
            < ops/cleanup.php || echo "ops appfront-jpwc: exit $? (zie hierboven)"
          for e in jpweb-geotest-1013@agentmail.to jpweb-scan-test@agentmail.to; do
            ssh -i ~/.ssh/jpweb_deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "OPS_ROOT='$DEPLOY_PATH' OPS_JOB='count-$(echo $e | cut -d@ -f1)-20261014' OPS_MODE='count_user' OPS_EMAIL='$e' /usr/local/bin/php -d display_errors=stderr -d error_reporting=E_ALL" \
              < ops/cleanup.php || echo "ops count: exit $?"
          done

      - name: Verify production deployment
        env:
          BASE_URL: https://jpwebcreation.nl
        run: |
          set -euo pipefail

          routes=(
            "/"
            "/ai/"
            "/ai-vindbaarheid/"
            "/blog/"
            "/blog/hoeveel-tijd-kost-een-vooropname-installatiebedrijf.html"
            "/digitale-opname/"
            "/digitale-opname/vergelijken/"
            "/privacyverklaring/"
            "/algemene-voorwaarden/"
            "/projecten/mikes-pianoshow/"
            "/projecten/haveka-installatie/"
            "/projecten/supper-services/"
            "/projecten/ec-eens/"
            "/projecten/archipel-bouwadvies/"
            "/projecten/wildfloweroffice/"
            "/projecten/synk-by-jeanette/"
            "/sitemap.xml"
            "/robots.txt"
          )

          for route in "${routes[@]}"; do
            echo "Controleer $route"
            if ! curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "$BASE_URL$route" > /dev/null; then
              echo "Kritieke route mislukt: $route" >&2
              exit 1
            fi
          done

          bash .github/scripts/check-redirects.sh "$BASE_URL"

          headers="$(curl --silent --show-error --head \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$BASE_URL/")"
          if grep -iq '^x-robots-tag:.*noindex' <<< "$headers"; then
            echo "Productie bevat ten onrechte een noindex-header." >&2
            exit 1
          fi

          missing_url="$BASE_URL/__jpweb_deployment_smoke_test__"
          missing_status="$(curl --silent --show-error --output /tmp/jpweb-404.html \
            --write-out '%{http_code}' "$missing_url")"
          if [ "$missing_status" != "404" ]; then
            echo "Onbekende route gaf HTTP $missing_status in plaats van 404." >&2
            exit 1
          fi
          grep -q 'Hier staat niets meer.' /tmp/jpweb-404.html

          contact_state="$(curl --fail --silent --show-error \
            "$BASE_URL/contact.php?action=state")"
          grep -q '"values":\[\]' <<< "$contact_state"

          ai_scan_state="$(curl --fail --silent --show-error \
            "$BASE_URL/ai-scan.php?action=state")"
          grep -q '"values":\[\]' <<< "$ai_scan_state"
